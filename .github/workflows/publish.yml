name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      workspace:
        description: "Workspace to publish (leave blank to publish all)"
        type: choice
        options:
          - ""
          - "@zod-crawler/core"
          - "@zod-crawler/cli"
        default: ""

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          if [ -n "${{ inputs.workspace }}" ]; then
            npm publish --workspace="${{ inputs.workspace }}" --access public
          else
            npm publish --workspaces --access public
          fi

  docker:
    if: ${{ github.event_name == 'push' || inputs.workspace == '' }}
    runs-on: ubuntu-latest
    environment: Publish
    strategy:
      matrix:
        include:
          - image: zod-crawler-web
            dockerfile: apps/web/Dockerfile
          - image: zod-crawler-cli
            dockerfile: apps/cli/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: figulusproject/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
