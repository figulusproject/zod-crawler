name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Playwright Chromium
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium

      - name: Test (browser)
        if: matrix.node-version == 24
        run: npm run test:browser

      - name: Coverage
        if: matrix.node-version == 24
        run: npm run coverage

      - name: Update coverage badge
        if: matrix.node-version == 24 && github.ref == 'refs/heads/main'
        run: |
          node -e "
            const fs = require('fs');
            const { total } = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const pct = total.lines.pct;
            const color =
              pct >= 90 ? 'brightgreen' :
              pct >= 80 ? 'green' :
              pct >= 70 ? 'yellowgreen' :
              pct >= 50 ? 'orange' : 'red';
            fs.writeFileSync('docs/coverage-badge.json', JSON.stringify({
              schemaVersion: 1,
              label: 'coverage',
              message: pct + '%',
              color,
            }));
          "
          if ! git diff --quiet -- docs/coverage-badge.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/coverage-badge.json
            git commit -m "update coverage badge [skip ci]"
            git push
          fi

      - name: Format check
        run: npm run format:check
